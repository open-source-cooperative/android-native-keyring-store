name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: x86_64-linux-android
          components: llvm-tools-preview
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the NDK and SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
      - name: Build the instrumented library for the emulator
        env:
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: -C instrument-coverage --cfg keyring_coverage
        run: |
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          cargo build --target x86_64-linux-android --features legacy,compile-tests,android-log
          mkdir -p keyring-tester/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/debug/libandroid_native_keyring_store.so keyring-tester/app/src/main/jniLibs/x86_64/
      - name: Build keyring-tester
        working-directory: keyring-tester
        run: ./gradlew --no-daemon assembleDebug
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: .github/scripts/keyring-tester-coverage.sh
      - name: Write the coverage report
        run: |
          bin="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          "$bin/llvm-profdata" merge -sparse keyring.profraw -o keyring.profdata
          "$bin/llvm-cov" export -format=lcov -instr-profile=keyring.profdata \
            -ignore-filename-regex='/\.cargo/registry/|/rustc/|/rustlib/|/src/tests/' \
            target/x86_64-linux-android/debug/libandroid_native_keyring_store.so > lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
